version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Base image digests in docker/Dockerfile and docker/Dockerfile.release.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
