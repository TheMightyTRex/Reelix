[package]
name = "reelix-api-types"
description = "Request/response DTOs shared by the Reelix server and web UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Derive OpenAPI schemas (server only; keeps utoipa out of the wasm bundle).
openapi = ["dep:utoipa"]

[dependencies]
chrono.workspace = true
reelix-core.workspace = true
reelix-decision.workspace = true
reelix-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
utoipa = { workspace = true, optional = true }

[lints]
workspace = true
