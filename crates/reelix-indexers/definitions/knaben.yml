  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]
    music-search: [q]
    book-search: [q]
settings:
  - { name: info_api, type: info, label: About, default: "No account needed. Knaben is a public meta-search; please keep the number of searches reasonable." }
search:
  paths:
    - path: "{{ if .Keywords }}v2/search{{ else }}v2/browse{{ end }}"
      response:
        type: json
  inputs:
    q: "{{ .Keywords }}"
    c: '{{ join .Categories "," }}'
    s: 100
  rows:
    selector: hits
  fields:
    category:
      selector: "categoryId[0]"
    title:
      selector: title
    details:
      selector: details
      optional: true
    magnet:
      selector: magnetUrl
      optional: true
    download:
      selector: link
      optional: true
    infohash:
      selector: hash
      optional: true
    size:
      selector: bytes
    seeders:
      selector: seeders
    leechers:
      selector: peers
    grabs:
      selector: grabs
      optional: true
    date:
      selector: date
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
