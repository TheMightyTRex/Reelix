# Knaben Database (https://knaben.org), a public meta-search over many torrent sites.
# Written for Reelix (RFX-82), so a move from Prowlarr, where Knaben is a built-in indexer, keeps it.
# Uses Knaben's public API v2 (https://knaben.org/api/v2/), which asks clients to use GET (so its
# edge servers can cache) and not to overload it: one request per search, 100 results, and at least
# two seconds between requests. Category ids follow Knaben's own list.
id: knaben
name: Knaben
description: Knaben Database, a public meta-search over many torrent sites (API v2)
language: en-US
type: public
links:
  - https://api.knaben.org/
# Prowlarr stores the site address, not the API address; either is taken as the API.
legacylinks:
  - https://knaben.org/
  - https://knaben.eu/
requestDelay: 2
caps:
  categorymappings:
    - { id: 1000000, cat: "Audio", desc: "Audio" }
    - { id: 1001000, cat: "Audio/MP3", desc: "MP3" }
    - { id: 1002000, cat: "Audio/Lossless", desc: "Lossless" }
