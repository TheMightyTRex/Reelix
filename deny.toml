# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
# Each entry has no compatible fix upstream; recheck when librespot or openidconnect update.
ignore = [
    # quick-xml 0.38 is pinned by librespot-core 0.8, whose session.rs parses the ProductInfo
    # packet sent by Spotify over the authenticated session (plain Reader, no attributes() or
    # NsReader). librespot-core 0.8.0, the newest release, still asks for quick-xml ^0.38.
    # Reelix's own quick-xml is a fixed version.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via librespot-core: plain Reader on Spotify's ProductInfo packet over the authenticated session" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 via librespot-core: plain Reader on Spotify's ProductInfo packet over the authenticated session" },
    # No fixed rsa release exists. The attack needs private-key decryption; librespot and
    # openidconnect only verify signatures with public keys.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used only for public-key signature verification" },
    # crypto-bigint 0.5 is pinned by elliptic-curve 0.13 (openidconnect's p256/p384), which
    # only verifies token signatures with public keys.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only handles public values in signature verification" },
    # libsqlite3-sys 0.30 (bundled SQLite before 3.54) is pinned by sqlx 0.8; the fix needs libsqlite3-sys 0.39,
    # and even sqlx 0.9.0 (the newest, 14 November 2026) allows only libsqlite3-sys below 0.38.
    # Only a database whose -wal file a less trusted party could write is exposed; Reelix opens only its own.
    { id = "RUSTSEC-2026-0459", reason = "Reelix opens only its own database files; no sqlx release allows libsqlite3-sys 0.39 yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Everything here is compatible with GPL-3.0-or-later.
allow = [
    "GPL-3.0-or-later",
    # RustyPipe is GPLv3-only; combined binaries can be distributed under GPLv3.
    "GPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]

# RustyPipe declares the deprecated SPDX id "GPL-3.0", which means GPL-3.0-only.
[[licenses.clarify]]
crate = "rustypipe"
expression = "GPL-3.0-only"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
