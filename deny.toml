# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
# Each entry has no compatible fix upstream; recheck when librespot or openidconnect update.
ignore = [
    # rustls 0.22, rustls-webpki 0.102 and quick-xml 0.38 come only from librespot-core 0.8
    # (hyper-proxy2 and its XML parsing). Reelix never configures a librespot proxy.
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.22 via librespot's unused proxy connector" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.22 via librespot's unused proxy connector" },
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 via librespot's unused proxy connector" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 via librespot's unused proxy connector" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 via librespot's unused proxy connector" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 via librespot's unused proxy connector" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102 via librespot's unused proxy connector" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 is pinned by librespot-core; Reelix's own quick-xml is fixed" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 is pinned by librespot-core; Reelix's own quick-xml is fixed" },
    # No fixed rsa release exists. The attack needs private-key decryption; librespot and
    # openidconnect only verify signatures with public keys.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used only for public-key signature verification" },
    # crypto-bigint 0.5 is pinned by elliptic-curve 0.13 (openidconnect's p256/p384), which
    # only verifies token signatures with public keys.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only handles public values in signature verification" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Everything here is compatible with GPL-3.0-or-later.
allow = [
    "GPL-3.0-or-later",
    # RustyPipe is GPLv3-only; combined binaries can be distributed under GPLv3.
    "GPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]

# webpki 0.22 (via librespot's hyper-proxy2) ships an ISC-style LICENSE but declares none.
[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# RustyPipe declares the deprecated SPDX id "GPL-3.0", which means GPL-3.0-only.
[[licenses.clarify]]
crate = "rustypipe"
expression = "GPL-3.0-only"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
